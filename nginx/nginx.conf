events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'cf_ip="$http_cf_connecting_ip" host="$host"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 信任 Cloudflare 回源 IP 段（用于获取真实访客 IP）
    # 完整列表见 https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    upstream nextjs {
        server app:3000;
        keepalive 32;
    }

    # 监听 80（容器内端口，外部映射到 8080），接受 Cloudflare 回源
    server {
        listen 80 default_server;
        server_name _;

         # 用户上传的图片由 nginx 直接发，不进 Node。
         #
         # 【为什么必须这么改，这是个潜伏的真 bug】2026-09-22 实测：
         # Next 只服务「服务端启动那一刻就已经存在」的 public 文件。
         # 运行时新写进 public/uploads 的文件一律 404，直到 app 容器重启为止。
         # 复现只要两步：往 /app/public/uploads/products/ 里 cp 一个文件 → 404；
         # restart app → 同一个文件 200。连把能访问的那张原样改个名都会 404，
         # 所以跟权限、扩展名都无关。
         # 影响面是所有上传入口：论坛配图、友链 logo、后台商品主图——
         # 传完看起来就是「图挂了」，而重启之后又好了，最难查的那种。
         #
         # 交给 nginx 之后：① 传完即时可见；② 静态图不再占 Node 的内存和事件循环
         # （这台机器只有 1.8G，能少一件是一件）；③ 带上强缓存。
         #
         # 安全性：上传接口按文件头嗅探真实类型，只放行 jpg/png/gif/webp，
         # #*不含 SVG**（见 api/upload/route.ts 的 ALLOWED 与 sniff），
         # 所以这里直发没有存储型 XSS 的口子。nosniff 再加一道保险。
        location /uploads/ {
            alias /var/www/uploads/;
            access_log off;
            add_header Cache-Control "public, max-age=2592000" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # 让 Next.js 知道用户实际走的是 HTTPS（CF 已经在外层加密）
        location / {
            # CVE-2025-29927：带 x-middleware-subrequest 头即可整个跳过 Next middleware
            # （14.2.3 未修，本站实测公网可绕过 /admin 与 /api/admin 的 ADMIN 校验）。
            # 这个头只应由 Next 内部子请求产生，任何从客户端进来的值一律清空——
            # 空值 nginx 不会转发该头，绕过即失效。所有外部流量（域名回源 + IP 直连）
            # 都经过这个 location，所以这道清洗对两条入口都生效。
            # 【这是缓解不是根治】根治是升级 Next 到 14.2.25+，见 docs 第二十三节。
            proxy_set_header x-middleware-subrequest "";

            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90s;
        }
    }
}
