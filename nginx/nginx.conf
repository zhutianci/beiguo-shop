# 多开 worker、放大连接池：8080（公网 IP 直连）要在 nginx 里再转一跳到 80，每个请求占的连接数翻倍，
# 单 worker 1024 被扫描器 / 慢连接打满时，走隧道的正常买家也跟着排队（终审 2026-09-26）
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $remote_addr 是 realip 核实后的访客 IP；peer 是 TCP 对端（realip 改写之前）：
    #   peer=cloudflared 容器的内网 IP → 走域名（隧道）进来的
    #   peer=127.0.0.1               → 走公网 IP 直连进来、经 8080 清洗后转过来的
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'cf_ip="$http_cf_connecting_ip" host="$host" peer="$realip_remote_addr"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 不在 404/502 页和 Server 头里报版本号（2026-09 线上实测 404 页脚是 nginx/1.31.0）
    server_tokens off;

    upstream nextjs {
        server app:3000;
        keepalive 32;
    }

    # ---- 页面写请求 / Server Action 闸（CVE-2025-55184 / CVE-2025-67779 一类 RSC 反序列化 DoS）----
    # 本站没有 Server Actions（全仓无 'use server'），但 Next 14 对「带 Next-Action 头」或
    # 「POST multipart/表单」的页面请求，会在校验 action id **之前**先做 RSC 反序列化
    # （next/dist/server/app-render/action-handler.js），一个构造好的请求就能让 Node 进程卡死，
    # 而容器没有探活、进程卡死不会退出也就不会被重启 —— 全站停摆到有人手工处理。
    # 根治是 Next 升到 14.2.35（package.json），这道闸在升级后也保留，作纵深防御：
    #   ① 任何带 Next-Action 头的请求 → 400（本站前端从不发这个头）
    #   ② 对非 /api/* 路径的写请求（POST/PUT/DELETE/PATCH/OPTIONS…）→ 405。
    #      站内所有写请求都是 fetch('/api/...')：下单、登录、上传、SmsForwarder 收款回调
    #      （/api/pay/sms-notify）、cron（直连 app:3000，不经 nginx）；非 /api 的 Route Handler
    #      只有 indexnow-key.txt，且只处理 GET。Route Handler 不经过 action 处理，所以放行 /api/*。
    # 用的是 nginx 规范化之后的 $uri：/api/../login 这种写法算作 /login，照样被拦。
    # 【残余】往不存在的 /api 路径 POST multipart 且不带 Next-Action 头，这道闸挡不住，只能靠升级。
    # 【以后要加页面级表单 / Server Action 时】先改这里，否则会被 405/400 挡掉。
    map $http_next_action $deny_next_action {
        default 1;
        ""      0;
    }
    map "$request_method:$uri" $deny_page_write {
        default            1;
        "~^(GET|HEAD):"    0;
        "~^[A-Z]+:/api/"   0;
    }

    # 全站默认 Referrer-Policy。app 自己设过的（营销打开像素、退订跳转设的 no-referrer）以 app 为准，
    # 不再叠加一条：响应里有多个 Referrer-Policy 时浏览器取最后一个，叠加会把 no-referrer 覆盖掉。
    # add_header 的值为空串时 nginx 不输出这个头。
    map $upstream_http_referrer_policy $sec_referrer_policy {
        ""      "strict-origin-when-cross-origin";
        default "";
    }

    # ================================================================
    # 访客 IP 从哪来：两个入口、两个监听口，信任只跟着「监听口」走
    # ================================================================
    #
    # 【出过的问题】以前只有一个 80，realip 只信任 Cloudflare 边缘 IP 段，但：
    #   ① 走隧道的流量来自 cloudflared 容器（内网 IP），不在信任段里，realip 根本没生效；
    #   ② 客户端带来的 CF-Connecting-IP / X-Forwarded-For 被原样转给了 app；
    #   ③ 80 又映射在公网上。于是任何人直连服务器 IP、自己写一个 CF-Connecting-IP，
    #      app 就把它当成真实 IP —— 全站按 IP 的限流（领券每 IP 一张、兑换、上传、
    #      开票填写、新闻浏览计数……）和日志里的 IP 全都可以随手伪造。
    #
    # 【现在的做法】
    #   容器 80   —— 只给 cloudflared 用（隧道 ingress 配的是 nginx:80，走容器网络）。
    #               **不映射到宿主机**，公网碰不到它，所以这里可以信任 CF-Connecting-IP
    #               （Cloudflare 边缘会覆盖掉访客自己带的同名头，cloudflared 原样转来）。
    #   容器 8080 —— 宿主机 80 映射到这里（docker-compose.yml 的 ports），即公网 IP 直连
    #               与服务器上 curl http://127.0.0.1 的入口。这里**什么头都不信**：
    #               用 TCP 对端地址覆盖 CF-Connecting-IP，再经回环转给容器 80。
    #   两个口最终都落到容器 80 的同一套 location，路由与安全清洗（x-middleware-subrequest）
    #   只维护一份，不会出现「改了一个入口忘了另一个」。
    #
    # 【改 compose 时别踩】宿主机端口只能映射到 8080。写回 "80:80" 等于把受信任的口
    #   开到公网上 —— 公网来的 IPv4 源地址是公网段，下面的信任段不认，仍然伪造不了；
    #   但同 VPC 的内网机器、以及经 docker-proxy 转发的连接（源地址是网桥网关）都会被信任。
    #   信任段只是第二道闸，第一道闸是「受信任的口不对外」。
    #
    # 【将来若备案后改成橙云直接回源（不走隧道）】那时回源连接来自 Cloudflare 边缘 IP，
    #   要在 8080 那个 server 里按 https://www.cloudflare.com/ips/ 加 set_real_ip_from，
    #   并把 CF-Connecting-IP 改成透传 $remote_addr（realip 之后的值），而不是现在这样一律覆盖。

    # 容器 80：隧道入口（受信任）
    server {
        listen 80 default_server;
        server_name _;

        # 谁能连到这个口：同一 compose 网络里的容器（cloudflared；app/cron 不经 nginx）、
        # 宿主机自己、以及下面 8080 那个 server 经回环转过来的请求。
        # 容器网络地址一律在私有段；8080 转来时对端是 127.0.0.1，它带的 CF-Connecting-IP
        # 是 8080 刚用 TCP 对端地址写进去的，可信。
        # CF-Connecting-IP 缺失或不是合法 IP 时 realip 不改写，$remote_addr 保持 TCP 对端。
        set_real_ip_from 127.0.0.1;
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        set_real_ip_from fd00::/8;
        real_ip_header CF-Connecting-IP;

        # 页面写请求 / Server Action 闸（理由见 http 块里那两个 map）。放在 server 级、不放进 location：
        # 在选 location 之前就判，/uploads/ 等所有路径一视同仁。8080 入口经回环转到这里，两个入口都覆盖。
        if ($deny_next_action) { return 400; }
        if ($deny_page_write)  { return 405; }

        # /api/cron/* 只给 cron 容器（直连 app:3000）和后台「手动触发管线」（容器内 127.0.0.1:3000）用，
        # 这两条都不经过 nginx。外部入口一律 404：不暴露接口，也杜绝有人拿「域名 + ?secret=」排障、
        # 把密钥写进 nginx / Cloudflare 日志。
        # ^~ 前缀匹配 + nginx 默认的 merge_slashes 与百分号解码：/api//cron/x、/api/%63ron/x 也会命中。
        # 【部署前】服务器上 grep NEWS_INTERNAL_BASE .env.production，确认没有配成公网域名，
        # 否则后台手动触发会被这里 404。
        location ^~ /api/cron/ {
            access_log off;
            return 404;
        }

         # 用户上传的图片由 nginx 直接发，不进 Node。
         #
         # 【为什么必须这么改，这是个潜伏的真 bug】2026-09-22 实测：
         # Next 只服务「服务端启动那一刻就已经存在」的 public 文件。
         # 运行时新写进 public/uploads 的文件一律 404，直到 app 容器重启为止。
         # 复现只要两步：往 /app/public/uploads/products/ 里 cp 一个文件 → 404；
         # restart app → 同一个文件 200。连把能访问的那张原样改个名都会 404，
         # 所以跟权限、扩展名都无关。
         # 影响面是所有上传入口：论坛配图、友链 logo、后台商品主图——
         # 传完看起来就是「图挂了」，而重启之后又好了，最难查的那种。
         #
         # 交给 nginx 之后：① 传完即时可见；② 静态图不再占 Node 的内存和事件循环
         # （这台机器只有 1.8G，能少一件是一件）；③ 带上强缓存。
         #
         # 安全性：上传接口按文件头嗅探真实类型，只放行 jpg/png/gif/webp，
         # #*不含 SVG**（见 api/upload/route.ts 的 ALLOWED 与 sniff），
         # 所以这里直发没有存储型 XSS 的口子。nosniff 再加一道保险。
        location /uploads/ {
            alias /var/www/uploads/;
            access_log off;
            add_header Cache-Control "public, max-age=2592000" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # 让 Next.js 知道用户实际走的是 HTTPS（CF 已经在外层加密）
        location / {
            # CVE-2025-29927：带 x-middleware-subrequest 头即可整个跳过 Next middleware
            # （14.2.3 未修，本站实测公网可绕过 /admin 与 /api/admin 的 ADMIN 校验）。
            # 这个头只应由 Next 内部子请求产生，任何从客户端进来的值一律清空——
            # 空值 nginx 不会转发该头，绕过即失效。所有外部流量（域名回源 + IP 直连）
            # 都经过这个 location，所以这道清洗对两条入口都生效。
            # 【这是缓解不是根治】根治是升级 Next（已在 package.json 升到 14.2.35；14.2.25~14.2.34
            # 均被 npm 标为有漏洞，见 2025-12-11 安全公告）。升级上线后这条清洗仍保留，作纵深防御。
            proxy_set_header x-middleware-subrequest "";

            # 访客 IP：三个头一律写成 realip 核实后的 $remote_addr，客户端带来的原值不往下传。
            # app 的 clientIp()（lib/news/rate-limit.ts）按 cf-connecting-ip → x-forwarded-for
            # → x-real-ip 的顺序取，几处路由里还有各自的同款写法；三个头都覆盖，哪种取法都拿到同一个值。
            # 【不要改回 $proxy_add_x_forwarded_for】那是「客户端带来的 XFF + 对端」，
            # 第一段就是客户端随便写的，而 app 取的恰好是第一段。
            proxy_set_header CF-Connecting-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            # 不给 Next 转 WebSocket 升级：全站没有 WebSocket / EventSource，清空没有代价，
            # 少一条进 Node 的长连接路径。Connection 'upgrade' 保持不动 —— 改成空会改变上游 keepalive，
            # Node 默认 5 秒 keepAliveTimeout 下复用连接刚好被关时，非幂等的 POST（下单）会直接 502。
            proxy_set_header Upgrade "";
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90s;

            # 安全响应头：只加在这里。8080 转进来的请求也走这个 location，两个入口都生效。
            # /uploads/ 有自己的 add_header（nginx 规则：本层有 add_header 就不继承上层），图片也不需要防嵌入。
            proxy_hide_header X-Powered-By;
            # 防点击劫持：只允许同源嵌入（兄弟子域 view / zz 也算不同源，一样拦住）。
            # 后台营销预览是 srcdoc iframe，不受影响。别改成 DENY / 'none'：拦不住更多攻击，反而可能误伤同源预览
            add_header X-Frame-Options "SAMEORIGIN" always;
            # CSP 只放 frame-ancestors：加 script-src 会破坏 Next 的内联水合脚本，要单独设计再上
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy $sec_referrer_policy always;
            # HSTS 先用 300 秒试运行，一周没问题再改成 15552000。不加 includeSubDomains / preload：
            # 否则兄弟子域也会被强制 https，而且一旦加上很难撤回。经 8080 走明文 http 的响应带上它也无害（浏览器只认 https 响应里的）
            add_header Strict-Transport-Security "max-age=300" always;

            # 上传接口单独收紧请求体：app 那边单文件上限 5MB（api/upload/route.ts），
            # 超限时 nginx 在把请求体读进来之前就回 413，不必先缓冲 20MB 再交给 Node 拒绝。
            # 【嵌套 location 的继承坑】这里**绝对不能**写任何 proxy_set_header / add_header：
            # nginx 规则是本层只要有一条，就整组不再继承上层 —— 上面的 x-middleware-subrequest 清空、
            # 三个访客 IP 头覆盖、安全响应头会全部失效。proxy_pass 不继承，必须写。
            location = /api/upload {
                client_max_body_size 6m;
                proxy_pass http://nextjs;
            }
        }
    }

    # 容器 8080：公网 IP 直连入口（不受信任）。宿主机 80 映射到这里。
    # 只做一件事：用 TCP 对端地址覆盖掉客户端自带的 IP 类请求头，再原样转给容器 80。
    # 不在这里写任何业务 location —— 那样两个入口的路由和安全清洗就得维护两份。
    server {
        listen 8080 default_server;
        server_name _;

        # 这里不配 set_real_ip_from：$remote_addr 就是 TCP 对端，客户端改不了。
        # 日志由容器 80 那边统一记（peer=127.0.0.1 就是从这里转过去的），这里不重复记。
        access_log off;

        location / {
            proxy_set_header CF-Connecting-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_pass http://127.0.0.1:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            # 比容器 80 那边的 90s 略长：超时由内层先判，这里只原样转回它的 504
            proxy_read_timeout 95s;
        }
    }
}
