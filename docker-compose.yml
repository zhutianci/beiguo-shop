services:
  # Next.js 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beiguo-app
    restart: unless-stopped
    # 内存上限：整机只有 1.8G。不设限时，抓取/构建类任务把内存吃满，
    # 内核 OOM killer 会按 RSS 挑目标，MySQL(约 400MB) 反而比 app 更容易被杀，
    # 结果是「应用出 bug → 整站数据库挂掉」。限制在 app 自己的 cgroup 内，
    # 超限只会重启 app（restart: unless-stopped），数据库不受牵连。
    mem_limit: 1024m
    mem_reservation: 256m
    expose:
      - "3000"
    environment:
      # 业务时区。不设时 Node 跑在 UTC，凡是用本地时间算日期的地方（订单号、
      # 会员开通/到期日）都会在北京时间凌晨 0-8 点错一天。
      - TZ=Asia/Shanghai
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/beiguo_shop
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_APP_NAME=贝果科技
      - NEXT_PUBLIC_APP_URL=${APP_URL}
      - NODE_ENV=production
      # 定时任务密钥
      - CRON_SECRET=${CRON_SECRET}
      # 阿里云（邮件 + 短信共用一对 AccessKey）
      - ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID}
      - ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET}
      - ALIYUN_REGION=${ALIYUN_REGION}
      # 阿里云邮件推送 DirectMail
      - ALIYUN_DM_ACCOUNT=${ALIYUN_DM_ACCOUNT}
      - ALIYUN_DM_NOREPLY=${ALIYUN_DM_NOREPLY}
      - ALIYUN_DM_FROM_ALIAS=${ALIYUN_DM_FROM_ALIAS}
      # 阿里云短信
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME}
      - ALIYUN_SMS_TEMPLATE_CODE=${ALIYUN_SMS_TEMPLATE_CODE}
      # V免签式收款（监控个人支付宝收款码到账，按唯一金额匹配）
      - VMQ_KEY=${VMQ_KEY}
      - VMQ_PAY_TIMEOUT=${VMQ_PAY_TIMEOUT}
      - VMQ_WEBHOOK_TOKEN=${VMQ_WEBHOOK_TOKEN}
      # 卡密加密密钥（自动发货；务必设置且勿丢失，丢失则已存卡密无法解密）
      - CARDKEY_SECRET=${CARDKEY_SECRET}
      # 短信接码 hero-sms
      - HEROSMS_API_KEY=${HEROSMS_API_KEY}
      - HEROSMS_BASE=${HEROSMS_BASE}
      - HEROSMS_TIMEOUT_MIN=${HEROSMS_TIMEOUT_MIN}
    volumes:
      # 论坛上传图片持久化（容器重建不丢）
      - forum_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # MySQL 数据库（不暴露外部端口，仅容器内访问）
  db:
    image: mysql:8.0
    container_name: beiguo-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=beiguo_shop
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # Nginx 反向代理
  # - cloudflared 通过容器网络访问 nginx:80（用户走域名时）
  # - 80 端口对外暴露，供 IP 直接访问（用户走公网IP时）
  nginx:
    image: nginx:alpine
    container_name: beiguo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  # 定时任务容器：每天中午 12:00（北京时间）内网调用提醒接口
  cron:
    image: alpine:3.20
    container_name: beiguo-cron
    restart: unless-stopped
    environment:
      - CRON_SECRET=${CRON_SECRET}
    # 安装 curl + 时区，写入 crontab（0 12 * * * = 每天 12:00），前台运行 crond
    command: >
      sh -c "apk add --no-cache curl tzdata >/dev/null 2>&1 &&
      cp /usr/share/zoneinfo/Asia/Shanghai /etc/localtime &&
      echo 'Asia/Shanghai' > /etc/timezone &&
      printf '0 12 * * * curl -fsS -X POST -H \"x-cron-secret: %s\" http://app:3000/api/cron/remind >> /var/log/cron.log 2>&1\n* * * * * curl -fsS \"http://app:3000/api/cron/vmq-close?secret=%s\" >> /var/log/cron.log 2>&1\n* * * * * curl -fsS \"http://app:3000/api/cron/sms-poll?secret=%s\" >> /var/log/cron.log 2>&1\n' \"$$CRON_SECRET\" \"$$CRON_SECRET\" \"$$CRON_SECRET\" > /etc/crontabs/root &&
      crond -f -l 8"
    depends_on:
      - app
    networks:
      - app-network

  # Cloudflare Tunnel 客户端（出站连接 Cloudflare，避开阿里云未备案拦截）
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: beiguo-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
  forum_uploads:
