services:
  # Next.js 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beiguo-app
    restart: unless-stopped
    # 内存上限：整机只有 1.8G。不设限时，抓取/构建类任务把内存吃满，
    # 内核 OOM killer 会按 RSS 挑目标，MySQL(约 400MB) 反而比 app 更容易被杀，
    # 结果是「应用出 bug → 整站数据库挂掉」。限制在 app 自己的 cgroup 内，
    # 超限只会重启 app（restart: unless-stopped），数据库不受牵连。
    mem_limit: 1024m
    mem_reservation: 256m
    expose:
      - "3000"
    environment:
      # 业务时区。不设时 Node 跑在 UTC，凡是用本地时间算日期的地方（订单号、
      # 会员开通/到期日）都会在北京时间凌晨 0-8 点错一天。
      - TZ=Asia/Shanghai
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/beiguo_shop
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_APP_NAME=贝果科技
      - NEXT_PUBLIC_APP_URL=${APP_URL}
      - NODE_ENV=production
      # 定时任务密钥
      - CRON_SECRET=${CRON_SECRET}
      # 阿里云（邮件 + 短信共用一对 AccessKey）
      - ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID}
      - ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET}
      - ALIYUN_REGION=${ALIYUN_REGION}
      # 阿里云邮件推送 DirectMail
      - ALIYUN_DM_ACCOUNT=${ALIYUN_DM_ACCOUNT}
      - ALIYUN_DM_NOREPLY=${ALIYUN_DM_NOREPLY}
      - ALIYUN_DM_FROM_ALIAS=${ALIYUN_DM_FROM_ALIAS}
      # 阿里云短信
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME}
      - ALIYUN_SMS_TEMPLATE_CODE=${ALIYUN_SMS_TEMPLATE_CODE}
      # V免签式收款（监控个人支付宝收款码到账，按唯一金额匹配）
      - VMQ_KEY=${VMQ_KEY}
      - VMQ_PAY_TIMEOUT=${VMQ_PAY_TIMEOUT}
      - VMQ_WEBHOOK_TOKEN=${VMQ_WEBHOOK_TOKEN}
      # 卡密加密密钥（自动发货；务必设置且勿丢失，丢失则已存卡密无法解密）
      - CARDKEY_SECRET=${CARDKEY_SECRET}
      # 短信接码 hero-sms
      - HEROSMS_API_KEY=${HEROSMS_API_KEY}
      - HEROSMS_BASE=${HEROSMS_BASE}
      - HEROSMS_TIMEOUT_MIN=${HEROSMS_TIMEOUT_MIN}
      # 以下一律用「裸变量名」写法（不带 =${...}）。
      # 原因：Next standalone 会把 .env.production 打进镜像，server.js 启动时用
      # loadEnvConfig 读进 process.env，而 dotenv 遵循「已存在的 env 优先」——
      # 若这里写成 - FOO=${FOO} 而 FOO 恰好没在 --env-file 里定义，
      # 容器会拿到 FOO=""（空字符串也算已存在），反而把镜像内 .env 里的真实值遮蔽掉。
      # 裸变量名的语义是「有就传、没有就完全不定义」，不会误伤已有配置。
      #
      # 企业微信群机器人通知（下单/支付/开票/收据/留言/库存告警/注册）
      - WECOM_WEBHOOK_URL
      - ORDER_MSG_WEBHOOK_URL
      - NOTIFY_EVENTS
      - LOW_STOCK_THRESHOLD
      # 卡密兑换：sysb（HongyunAI V2）的 Bearer Token。
      # 【只能放服务端】上游文档原文：「不要放在网页、App、小程序、浏览器插件、
      # Git、日志或截图里」。所以值写在 .env.production 里，仓库里只有这个名字。
      # 没配时兑换页会提示「充值服务暂未配置」，不会把请求发出去。
      - SYSB_API_TOKEN
      # 卡付 gpt1 走 V1 三段式的开关（'1' 才开）。
      # 【必须写成裸变量名】写 - FOO=${FOO} 在 FOO 未定义时会给容器一个空字符串，
      # 而 dotenv 遵循「已存在的 env 优先」，反而把镜像内 .env 的真实值遮蔽掉。
      # 【也必须写在这里】只改 .env.production 是不够的：那份文件是构建时
      # 打进镜像的，构建之后再改宿主机上的它，容器里读到的还是旧值。
      - SYSB_CARD_V1
      - SYSB_CARD_CLIENT_SITE
      # SEO：站长平台归属验证 + IndexNow 主动推送
      # 【必须列在这里】--env-file 只负责 compose 文件里的变量替换，
      # 不会自动把变量塞进容器。漏了这三行，.env.production 里配了也等于没配，
      # 而且表现是「静默不生效」：验证 meta 不输出、IndexNow 永远推 0 条。
      - GOOGLE_SITE_VERIFICATION
      - BING_SITE_VERIFICATION
      - BAIDU_SITE_VERIFICATION
      - INDEXNOW_KEY
      # 薄新闻页（没有全文层的）是否加 noindex。默认开启，设成 0 才关闭。
      # 详见 src/lib/news/thin.ts：97% 的站点 URL 是每小时批量产出的
      # 147 字 AI 摘要页，这组特征正对着 Google 的 scaled content abuse，
      # 而那种判定是站点级的——真掉下去的是商品页和充值落地页。
      - NEWS_THIN_NOINDEX
      # AI圈大事记：LLM 供应商与境外信源中继
      - LLM_PROVIDER
      - LLM_API_KEY
      - LLM_BASE_URL
      - LLM_FAST_MODEL
      - LLM_WRITE_MODEL
      - NEWS_DAILY_BUDGET_CENTS
      - NEWS_RELAY_URL
      - NEWS_RELAY_TOKEN
      - LLM_IN_PRICE
      - LLM_OUT_PRICE
      - LLM_THINKING
      # 全文层：抓正文当素材 / 每事件抓几篇 / 分诊批量 / 老事件回填开关。
      # 一律写**裸变量名**，不要写成 `- FOO=${FOO}` —— 后者在 FOO 未定义时会给容器一个
      # 空字符串，而 dotenv 遵循「已存在的 env 优先」，反而把镜像内 .env 的真实值遮蔽掉，
      # 让本来正常的功能失效（交接文档第六节踩过这个坑）。
      - NEWS_FETCH_BODY
      - NEWS_BODY_SOURCES
      - NEWS_TRIAGE_BATCH
      - NEWS_DETAIL_BACKFILL
      - UPLOAD_MAX_TOTAL_MB
      # 说明：以上全部留空也能正常起。lib/llm.ts 每项都有 || 兜底；
      # 缺 LLM_API_KEY 时管线只抓取去重、不写摘要，站点不会因此挂掉。
      # 缺 NEWS_RELAY_URL 时 viaRelay 的境外源全部跳过，中文源照常。
    volumes:
      # 论坛上传图片持久化（容器重建不丢）
      - forum_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # MySQL 数据库（不暴露外部端口，仅容器内访问）
  db:
    image: mysql:8.0
    container_name: beiguo-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=beiguo_shop
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # Nginx 反向代理
  # - cloudflared 通过容器网络访问 nginx:80（用户走域名时）
  # - 80 端口对外暴露，供 IP 直接访问（用户走公网IP时）
  nginx:
    image: nginx:alpine
    container_name: beiguo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  # 定时任务容器：续费提醒 / 收款单清理 / 接码轮询 / AI圈大事记内容管线
  # 任务表见 ./cron/crontab（挂载进来，不再用 printf 拼接 —— 那种写法 %s 个数
  # 和参数只要对不齐，crond 不报错、任务就是不跑，是最难查的一类故障）
  cron:
    image: alpine:3.20
    container_name: beiguo-cron
    restart: unless-stopped
    environment:
      - CRON_SECRET=${CRON_SECRET}
    volumes:
      - ./cron/crontab:/etc/cron.d/beiguo:ro
    # 密钥落到 /run/cron_secret，任务里用 $(cat ...) 现取：
    # 既不用把密钥写进版本库里的 crontab，也不必赌 busybox crond 会不会把环境变量传给子进程。
    # 任务表没挂上时 cp 会失败、整条 && 链断掉、容器起不来 —— 这是故意的：
    # 宁可容器反复重启被一眼看见，也不要 crond 起来了却一条任务都没有。
    #
    # ⚠️ 这里曾经写的是 tr -d '\r' 做 CRLF 防护，结果 YAML 折叠 + shell 双引号两层处理
    # 把反斜杠吃掉，变成 tr -d 'r'，把 crontab 里所有字母 r 删了：curl→cul、cron→con，
    # 全部任务静默失效且 crond 不报错。CRLF 防护改由 .gitattributes 强制 LF 承担，
    # 这里只用 cp —— 不要再往这条命令里加任何带反斜杠转义的东西。
    # ⚠️ 2026-09-19 事故：这个容器**每次启动都要联网装包**，而默认源
    # dl-cdn.alpinelinux.org 在这台机器上会卡死（db push 那条链路早就踩过，
    # 交接文档第五节记着「apk 要换阿里云源」）。apk 卡住时 && 链停在第一步，
    # cp 和 crond 都不会执行 —— 而容器状态仍然是 Up，
    # 表现为「所有定时任务静默全停，但看上去一切正常」，比直接崩溃难发现得多。
    # 所以装包前先把源换成阿里云。sed 用单引号，不要往这条命令里加任何反斜杠转义
    # （理由见上面那段「反斜杠被两层处理吃掉」的事故记录）。
    command: >
      sh -c "sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories &&
      apk add --no-cache curl tzdata >/dev/null 2>&1 &&
      cp /usr/share/zoneinfo/Asia/Shanghai /etc/localtime &&
      echo 'Asia/Shanghai' > /etc/timezone &&
      printf '%s' \"$$CRON_SECRET\" > /run/cron_secret && chmod 600 /run/cron_secret &&
      cp /etc/cron.d/beiguo /etc/crontabs/root &&
      crond -f -l 8"
    depends_on:
      - app
    networks:
      - app-network

  # Cloudflare Tunnel 客户端（出站连接 Cloudflare，避开阿里云未备案拦截）
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: beiguo-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
  forum_uploads:
