services:
  # Next.js 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beiguo-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/beiguo_shop
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_APP_NAME=贝果科技
      - NEXT_PUBLIC_APP_URL=${APP_URL}
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # MySQL 数据库（不暴露外部端口，仅容器内访问）
  db:
    image: mysql:8.0
    container_name: beiguo-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=beiguo_shop
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # Nginx 反向代理（仅供 cloudflared 内部访问，不对外暴露任何端口）
  nginx:
    image: nginx:alpine
    container_name: beiguo-nginx
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  # Cloudflare Tunnel 客户端（出站连接 Cloudflare，避开阿里云未备案拦截）
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: beiguo-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
