# 容器 stdout 日志上限（每个容器 20m × 5 份 ≈ 100MB）。
# 默认的 json-file 驱动不设 max-size 就不轮转：nginx 每个请求一行（含 /_next/static、RSC 预取），
# 两次重建之间会一直涨；日志落在系统盘 /var/lib/docker/containers 下，与 mysql_data 卷同盘，盘满会连带打挂 MySQL。
# 驱动保持 json-file，不要换成 local：部署说明里要直接 tail 原始 LogPath 文件核对访客 IP，local 是二进制格式读不了。
# 不要加 compress: true，理由同上。
# 只挂在 app / nginx / cron / cloudflared 上，db 刻意不加（理由见 db 服务里的注释）。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # Next.js 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beiguo-app
    restart: unless-stopped
    logging: *default-logging
    # 内存上限：整机只有 1.8G。不设限时，抓取/构建类任务把内存吃满，
    # 内核 OOM killer 会按 RSS 挑目标，MySQL(约 400MB) 反而比 app 更容易被杀，
    # 结果是「应用出 bug → 整站数据库挂掉」。限制在 app 自己的 cgroup 内，
    # 超限只会重启 app（restart: unless-stopped），数据库不受牵连。
    mem_limit: 1024m
    mem_reservation: 256m
    # 整机内存耗尽时，让内核优先挑 app 下手。
    # 【为什么需要这个】上面那条 mem_limit 只挡得住「app 自己的 cgroup 超限」，
    # 挡不住整机 OOM。实测 2026-09-16 至 09-21 的 dmesg：内核 OOM 触发 9 次，
    # **每一次被杀的都是 mysqld**——因为全局 OOM 按 RSS 挑目标，
    # MySQL 常驻 430MB，是这台机器上最肥的那个。触发点几乎都是在本机构建镜像。
    # 结果就是上面那段注释预判的失败模式换了条路径照样发生：应用出事 → 数据库挂掉。
    # 两害相权：app 被杀是几秒钟重启，MySQL 被杀是几十秒到几分钟外加 InnoDB 恢复，
    # 期间全站报错。所以把 app 标成首选受害者，把 db 保护起来（见 db 服务）。
    oom_score_adj: 500
    expose:
      - "3000"
    environment:
      # 业务时区。不设时 Node 跑在 UTC，凡是用本地时间算日期的地方（订单号、
      # 会员开通/到期日）都会在北京时间凌晨 0-8 点错一天。
      - TZ=Asia/Shanghai
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/beiguo_shop
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_APP_NAME=贝果科技
      - NEXT_PUBLIC_APP_URL=${APP_URL}
      - NODE_ENV=production
      # 定时任务密钥
      - CRON_SECRET=${CRON_SECRET}
      # 阿里云（邮件 + 短信共用一对 AccessKey）
      - ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID}
      - ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET}
      - ALIYUN_REGION=${ALIYUN_REGION}
      # 阿里云邮件推送 DirectMail
      - ALIYUN_DM_ACCOUNT=${ALIYUN_DM_ACCOUNT}
      - ALIYUN_DM_NOREPLY=${ALIYUN_DM_NOREPLY}
      - ALIYUN_DM_FROM_ALIAS=${ALIYUN_DM_FROM_ALIAS}
      # 营销邮件专用发信地址（控制台里须为「批量邮件」类型并已验证），如 marketing@mail.bigolab.com。
      # 没配时营销模块直接停发，绝不回落到 no-reply@ / remind@（docs/营销推广-设计.md 第 6 节）。
      # 用裸变量名写法，理由见下方「以下一律用裸变量名」那段注释。
      # MARKETING_DRY_RUN 刻意不出现在这里：它只给本地/预发用，进了生产 compose 等于埋一颗「假装发送」的雷
      - ALIYUN_DM_MARKETING
      # 阿里云短信
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME}
      - ALIYUN_SMS_TEMPLATE_CODE=${ALIYUN_SMS_TEMPLATE_CODE}
      # V免签式收款（监控个人支付宝收款码到账，按唯一金额匹配）
      - VMQ_KEY=${VMQ_KEY}
      - VMQ_PAY_TIMEOUT=${VMQ_PAY_TIMEOUT}
      - VMQ_WEBHOOK_TOKEN=${VMQ_WEBHOOK_TOKEN}
      # 卡密加密密钥（自动发货；务必设置且勿丢失，丢失则已存卡密无法解密）
      - CARDKEY_SECRET=${CARDKEY_SECRET}
      # 短信接码 hero-sms
      - HEROSMS_API_KEY=${HEROSMS_API_KEY}
      - HEROSMS_BASE=${HEROSMS_BASE}
      - HEROSMS_TIMEOUT_MIN=${HEROSMS_TIMEOUT_MIN}
      # 以下一律用「裸变量名」写法（不带 =${...}）。
      # 原因：Next standalone 会把 .env.production 打进镜像，server.js 启动时用
      # loadEnvConfig 读进 process.env，而 dotenv 遵循「已存在的 env 优先」——
      # 若这里写成 - FOO=${FOO} 而 FOO 恰好没在 --env-file 里定义，
      # 容器会拿到 FOO=""（空字符串也算已存在），反而把镜像内 .env 里的真实值遮蔽掉。
      # 裸变量名的语义是「有就传、没有就完全不定义」，不会误伤已有配置。
      #
      # 企业微信群机器人通知（下单/支付/开票/收据/留言/库存告警/注册）
      - WECOM_WEBHOOK_URL
      - ORDER_MSG_WEBHOOK_URL
      - NOTIFY_EVENTS
      - LOW_STOCK_THRESHOLD
      # 短信接码（通用板块，lib/jiema/upstream.ts）的 hero-sms v1 REST 地址。不设 = https://hero-sms.com/api/v1，
      # 生产一般不用设；只有集成测试 / 本地联调才指向假服务（scripts/mock-herosms.ts）。兼容协议地址与 key 沿用上面的
      # HEROSMS_BASE / HEROSMS_API_KEY（旧单品的 lib/herosms.ts 不读这个变量）。
      - HEROSMS_V1_BASE
      # 卡密兑换：sysb（HongyunAI V2）的 Bearer Token。
      # 【只能放服务端】上游文档原文：「不要放在网页、App、小程序、浏览器插件、
      # Git、日志或截图里」。所以值写在 .env.production 里，仓库里只有这个名字。
      # 没配时兑换页会提示「充值服务暂未配置」，不会把请求发出去。
      - SYSB_API_TOKEN
      # 领券 IP/设备限领哈希的盐（lib/coupon.ts claimHash）。不设 = 沿用 JWT_SECRET，与原来一致；
      # 轮换 JWT_SECRET 时把旧值写进这里，进行中的券批次限领记录才不会被清零
      - COUPON_CLAIM_SALT
      # 卡付 gpt1 走 V1 三段式的开关（'1' 才开）。
      # 【必须写成裸变量名】写 - FOO=${FOO} 在 FOO 未定义时会给容器一个空字符串，
      # 而 dotenv 遵循「已存在的 env 优先」，反而把镜像内 .env 的真实值遮蔽掉。
      # 【也必须写在这里】只改 .env.production 是不够的：那份文件是构建时
      # 打进镜像的，构建之后再改宿主机上的它，容器里读到的还是旧值。
      - SYSB_CARD_V1
      - SYSB_CARD_CLIENT_SITE
      # SEO：站长平台归属验证 + IndexNow 主动推送
      # 【必须列在这里】--env-file 只负责 compose 文件里的变量替换，
      # 不会自动把变量塞进容器。漏了这三行，.env.production 里配了也等于没配，
      # 而且表现是「静默不生效」：验证 meta 不输出、IndexNow 永远推 0 条。
      - GOOGLE_SITE_VERIFICATION
      - BING_SITE_VERIFICATION
      - BAIDU_SITE_VERIFICATION
      - INDEXNOW_KEY
      # 薄新闻页（没有全文层的）是否加 noindex。默认开启，设成 0 才关闭。
      # 详见 src/lib/news/thin.ts：97% 的站点 URL 是每小时批量产出的
      # 147 字 AI 摘要页，这组特征正对着 Google 的 scaled content abuse，
      # 而那种判定是站点级的——真掉下去的是商品页和充值落地页。
      - NEWS_THIN_NOINDEX
      # AI圈大事记：LLM 供应商与境外信源中继
      - LLM_PROVIDER
      - LLM_API_KEY
      - LLM_BASE_URL
      - LLM_FAST_MODEL
      - LLM_WRITE_MODEL
      - NEWS_DAILY_BUDGET_CENTS
      - NEWS_RELAY_URL
      - NEWS_RELAY_TOKEN
      - LLM_IN_PRICE
      - LLM_OUT_PRICE
      - LLM_THINKING
      # 全文层：抓正文当素材 / 每事件抓几篇 / 分诊批量 / 老事件回填开关。
      # 一律写**裸变量名**，不要写成 `- FOO=${FOO}` —— 后者在 FOO 未定义时会给容器一个
      # 空字符串，而 dotenv 遵循「已存在的 env 优先」，反而把镜像内 .env 的真实值遮蔽掉，
      # 让本来正常的功能失效（交接文档第六节踩过这个坑）。
      - NEWS_FETCH_BODY
      - NEWS_BODY_SOURCES
      - NEWS_TRIAGE_BATCH
      - NEWS_DETAIL_BACKFILL
      - UPLOAD_MAX_TOTAL_MB
      # 上传前检查的磁盘剩余空间底线（MB，默认 2048）：低于它所有上传一律 507，先保同盘的 MySQL（lib/upload-store.ts）
      - UPLOAD_MIN_FREE_MB
      # 以下几项以前只靠镜像里的 .env.production 生效：改值要重新构建，回滚镜像还会把旧值一起带回来
      # （例如轮换过 DISPENSE_API_SECRET 再回滚，二站调发卡接口就会 401）。
      # 裸变量名：--env-file 里有就传进容器，并优先于镜像内文件（dotenv 不覆盖已有 env）；
      # 没有就完全不定义，照旧回落到镜像内的值，行为不变。
      # 【上线前】宿主机 .env.production 若在上次构建后改过，这几项会按宿主机的新值立即生效 ——
      # 先比对镜像内外 .env.production 的哈希（docs/nginx-真实IP修复-部署说明.md 第九节 9.3）。
      - APP_URL
      - DISPENSE_API_SECRET
      - QUICK_REPLY_TTL_DAYS
      - FINANCE_LINK_TTL_DAYS
      - COUPON_LOCK_SWEEP_MIN
      - SYSB_FALLBACK_URL
      # 收款风控三项（lib/vmq.ts、api/pay/vmq/create）：VMQ_REUSE_COOLDOWN_MIN=0 是金额冷却的回滚开关，
      # 只有在这里列出才是「改宿主机 .env.production + docker compose up -d」即生效，不必重建镜像
      - VMQ_REUSE_COOLDOWN_MIN
      - VMQ_MAX_OPEN_PER_USER
      - ORDER_PAY_WINDOW_MIN
      # NEXT_PUBLIC_* 构建时若已定义，会被内联进产物（服务端代码也一样），这里改值不生效、仍需重建；
      # 构建时没定义的，才按这里的运行时值走
      - NEXT_PUBLIC_SITE_URL
      - NEWS_INTERNAL_BASE
      # 说明：以上全部留空也能正常起。lib/llm.ts 每项都有 || 兜底；
      # 缺 LLM_API_KEY 时管线只抓取去重、不写摘要，站点不会因此挂掉。
      # 缺 NEWS_RELAY_URL 时 viaRelay 的境外源全部跳过，中文源照常。
      #
      # —— 渠道分站（docs/多渠道分销-部署说明.md；设计 4.4、4.6、4.10）——
      # 一律裸变量名：没写进 .env.production = 完全不定义 = 代码默认值，而**默认值就是休眠**（主站行为与改造前逐字相同）。
      # 改这几项只需 force-recreate app（运行时读，不用重新构建）。
      # CHANNELS_ENABLED：总开关。不设 / 0 = 休眠（任何 Host 都是主站、不查 tenants 表）；1 = 按 Host 解析店面。
      #   **开 1 之前 nginx 里渠道 Host 必须已是 closed 或 channel**（部署说明 G1；单独开它会让渠道 Host 进应用）。
      - CHANNELS_ENABLED
      # HOST_STRICT：1 = 严格期（未登记 Host 404）。与 nginx 的 `"" "";` **同一天**切。不设 = 观察期
      - HOST_STRICT
      # PLATFORM_HOSTS：主站 Host 白名单（逗号分隔）。不设 = bigolab.com,www.bigolab.com,app,localhost,127.0.0.1。
      #   站长若用服务器公网 IP 进后台，开 CHANNELS_ENABLED 前要把 IP 加进来（否则 /admin 被 404，M14）
      - PLATFORM_HOSTS
      # CHANNEL_HOST_SUFFIX：只有这个后缀的 Host 才查库解析渠道（默认 .bigolab.com，只认一级子域）
      - CHANNEL_HOST_SUFFIX
      # JWT_LEGACY_TOKENS：不设 = accept（没有 aud 的老 token 只在主站 Host 有效）；上线 30 天后设 reject
      - JWT_LEGACY_TOKENS
      # TENANT_DATA_KEY：渠道收款账号 / 企业微信 webhook 的加密密钥（≥32 字节随机，hex 或 base64；主会话 D8）。
      #   与 JWT_SECRET 解耦：轮换 JWT_SECRET 不影响已录的收款账号。缺失或过短时录入 / 查看收款账号一律拒绝（503），其余功能不受影响。
      #   **生成后永远不要丢、不要改**（改了已录的收款账号就解不开，只能逐个重新录入）。生成：openssl rand -hex 32
      - TENANT_DATA_KEY
      # PRIVATE_FILES_DIR：打款凭证等私有文件目录，默认 /app/private（下面挂了持久卷）。一般不用设
      - PRIVATE_FILES_DIR
      # 微信机器人（docs/微信机器人-设计.md、docs/微信机器人-部署说明.md）。一律裸变量名：没配 = 完全不定义 = 机器人休眠。
      #   BOT_ENABLED=1 才工作；BOT_ADAPTER 缺省 wxpad；BOT_WXPAD_BASE 缺省 http://wxpad:8080（只走 Docker 内网）；
      #   BOT_WXPAD_ADMIN_KEY 与下面 wxpad 服务的 ADMIN_KEY 同值；BOT_WXPAD_HOOK_SECRET ≥ 32 字符（协议服务回调路径里的密钥）；
      #   BOT_WXPAD_PROXY 只在需要同城代理时设；BOT_LINK_ORIGIN 推送里链接的域名（缺省 APP_URL）；
      #   BOT_TENANT_REPLY=1 分站群留言带渠道快速回复链接；TRACK_CHANNEL_VIEWS=1 分站也记 PV/UV（要同时放开 nginx 渠道白名单里的 track）
      - BOT_ENABLED
      - BOT_ADAPTER
      - BOT_WXPAD_BASE
      - BOT_WXPAD_ADMIN_KEY
      - BOT_WXPAD_HOOK_SECRET
      - BOT_WXPAD_PROXY
      - BOT_WXPAD_WAKE_PATH
      # 收消息方式：缺省 webhook（协议服务回调 /api/bot/wxpad/hook/<密钥>）；PoC 若证实只能用 WebSocket，设 ws，
      # 同时要设 NODE_OPTIONS=--experimental-websocket（Node 20 自带的 WebSocket 要这个开关；不引入 ws 依赖）
      - BOT_WXPAD_RECEIVE
      - NODE_OPTIONS
      - BOT_LINK_ORIGIN
      - BOT_TENANT_REPLY
      - TRACK_CHANNEL_VIEWS
    volumes:
      # 论坛上传图片持久化（容器重建不丢）
      - forum_uploads:/app/public/uploads
      # 渠道结算的打款凭证等私有文件（主会话 D11；不在 public 下、nginx 不挂它，只能经超管接口读）。
      # 命名卷首次挂载会继承镜像里 /app/private 的 nextjs 属主（Dockerfile 预建并 chown），否则写凭证报 EACCES
      - private_files:/app/private
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # MySQL 数据库（不暴露外部端口，仅容器内访问）
  db:
    image: mysql:8.0
    container_name: beiguo-db
    restart: unless-stopped
    # 刻意不加 logging（日志上限见文件顶部 x-logging）：MySQL 往 stdout 写得很少；而 db 是 app 的依赖，
    # 这里的配置一有变化，下一次常规部署 `up -d app`（不带 --no-deps）会连带把 MySQL 重建一次，
    # 库会意外断几十秒（compose 对依赖服务的默认策略是 RecreateDiverged）。
    # 保护数据库不被整机 OOM 挑中。理由见 app 服务里那段。
    # 不用 -1000（那等于完全豁免）：真到了内存耗尽的地步，内核总得杀掉点什么，
    # 豁免 MySQL 会把目标推给 dockerd 或 sshd，那比杀 MySQL 更糟——
    # dockerd 一死整机两个站点全下线，而且连补救的通道都没了。
    oom_score_adj: -800
    # 关掉 performance_schema（2026-10-05，站长同意）：本站从不读它，它却常驻约 250MB（实测 memory/performance_schema/% 合计 249MB，
    # mysqld RSS 615MB）。1.8G 的机器上这 250MB 决定了服务器构建会不会把整机拖进 swap 颠簸（当天构建 36 分钟只拿到 5 分钟 CPU、
    # 主站一页 6 秒，被迫中止）。静态参数，改它要重建 db 容器（库断十几秒）；回滚 = 删掉这个参数再重建一次。
    command: --default-authentication-plugin=mysql_native_password --performance-schema=OFF
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=beiguo_shop
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # Nginx 反向代理：两个监听口，访客 IP 的信任只跟着监听口走（详见 nginx.conf 顶部那段）
  # - 容器 80：cloudflared 经容器网络访问 nginx:80（用户走域名时）。受信任，**不映射到宿主机**
  # - 容器 8080：宿主机 80 映射到这里，供公网 IP 直连与服务器上 curl http://127.0.0.1 用。
  #   不信任客户端自带的 CF-Connecting-IP / X-Forwarded-For，一律按 TCP 对端地址算
  # ⚠️ 不要改回 "80:80"：那是把受信任的口开到公网，任何人都能伪造 IP 绕过全站按 IP 的限流。
  # 更新 nginx.conf 或这里的 ports 后都要 up -d --no-deps --force-recreate nginx（reload 不够，见交接文档第二十三节）
  nginx:
    image: nginx:alpine
    container_name: beiguo-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 用户上传的图片直接由 nginx 发（理由见 nginx.conf 里 location /uploads/ 那段：
      # Next 不服务运行时新增的 public 文件，传完要等重启才可见）。
      # 只读挂载：nginx 只负责发，写入仍然只能走 /api/upload。
      - forum_uploads:/var/www/uploads:ro
      # 渠道站静态停业页（nginx.conf 里 Host 为 closed 时 rewrite 到它，不进应用；设计 4.3、15.6 第 3 层）
      - ./nginx/closed.html:/usr/share/nginx/closed/closed.html:ro
    depends_on:
      - app
    networks:
      - app-network

  # 定时任务容器：续费提醒 / 收款单清理 / 接码轮询 / AI圈大事记内容管线
  # 任务表见 ./cron/crontab（挂载进来，不再用 printf 拼接 —— 那种写法 %s 个数
  # 和参数只要对不齐，crond 不报错、任务就是不跑，是最难查的一类故障）
  cron:
    image: alpine:3.20
    container_name: beiguo-cron
    restart: unless-stopped
    logging: *default-logging
    environment:
      - CRON_SECRET=${CRON_SECRET}
    volumes:
      - ./cron/crontab:/etc/cron.d/beiguo:ro
    # 密钥落到 /run/cron_secret，任务里用 $(cat ...) 现取：
    # 既不用把密钥写进版本库里的 crontab，也不必赌 busybox crond 会不会把环境变量传给子进程。
    # 任务表没挂上时 cp 会失败、整条 && 链断掉、容器起不来 —— 这是故意的：
    # 宁可容器反复重启被一眼看见，也不要 crond 起来了却一条任务都没有。
    #
    # ⚠️ 这里曾经写的是 tr -d '\r' 做 CRLF 防护，结果 YAML 折叠 + shell 双引号两层处理
    # 把反斜杠吃掉，变成 tr -d 'r'，把 crontab 里所有字母 r 删了：curl→cul、cron→con，
    # 全部任务静默失效且 crond 不报错。CRLF 防护改由 .gitattributes 强制 LF 承担，
    # 这里只用 cp —— 不要再往这条命令里加任何带反斜杠转义的东西。
    # ⚠️ 2026-09-19 事故：这个容器**每次启动都要联网装包**，而默认源
    # dl-cdn.alpinelinux.org 在这台机器上会卡死（db push 那条链路早就踩过，
    # 交接文档第五节记着「apk 要换阿里云源」）。apk 卡住时 && 链停在第一步，
    # cp 和 crond 都不会执行 —— 而容器状态仍然是 Up，
    # 表现为「所有定时任务静默全停，但看上去一切正常」，比直接崩溃难发现得多。
    # 所以装包前先把源换成阿里云。sed 用单引号，不要往这条命令里加任何反斜杠转义
    # （理由见上面那段「反斜杠被两层处理吃掉」的事故记录）。
    command: >
      sh -c "sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories &&
      apk add --no-cache curl tzdata >/dev/null 2>&1 &&
      cp /usr/share/zoneinfo/Asia/Shanghai /etc/localtime &&
      echo 'Asia/Shanghai' > /etc/timezone &&
      printf '%s' \"$$CRON_SECRET\" > /run/cron_secret && chmod 600 /run/cron_secret &&
      cp /etc/cron.d/beiguo /etc/crontabs/root &&
      crond -f -l 8"
    depends_on:
      - app
    networks:
      - app-network

  # Cloudflare Tunnel 客户端（出站连接 Cloudflare，避开阿里云未备案拦截）
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: beiguo-cloudflared
    restart: unless-stopped
    logging: *default-logging
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - app-network

  # ---------------------------------------------------------------------------------------------
  # 微信机器人 · 协议服务（docs/微信机器人-设计.md §11.4）：WeChatPadPro，闭源程序，按不可信处理。
  # 【profiles: [bot]】平时的 `docker compose up -d`、`up -d app` 都不会碰这两个服务；
  #   要启动必须显式：docker compose --env-file .env.production --profile bot up -d wxpad wxpad-redis
  # 【不映射任何端口】宿主机与公网都访问不到；中枢经 Docker 内网 http://wxpad:8080 调它，它经内网回调 app:3000。
  # 【数据库】用现有 MySQL 里的专用库 wxpad 与专用账号 wxpad（只授权 wxpad.*，见 scripts/ops/bot-wxpad-db.sql），
  #   不另起 MySQL（官方示例那样会再吃 200MB 以上内存）。刻意不写 depends_on: db —— db 的配置一变，
  #   compose 会连带重建数据库（见 db 服务的注释），这里不给它任何理由。
  # 【内存】这台机器 1.8G：协议服务 256m、Redis 48m 上限；oom_score_adj 1000 = 整机内存紧张时最先被杀，
  #   restart 自动拉起、会话存在 Redis / MySQL 里自动重连；数据库（-800）与 app（+500）不受牵连。
  # 【版本】上线前把 BOT_WXPAD_IMAGE 锁到 PoC 验证过的那个镜像的 digest（wechatpadpro/wechatpadpro@sha256:...），不用 latest。
  #   2026-10-05 锁的是 Docker Hub v18.6 = latest（2025-08-25，程序 vios18.61-861）：sha256:436685d7d7f9ac690718caba8b8f95ace92ffe6edd2ccfa002459f364ca1282e。
  #   服务器配的几个镜像加速站都不代理这个镜像、直连 Docker Hub 超时，所以按 digest 经公共镜像站拉：
  #   docker pull docker.1ms.run/wechatpadpro/wechatpadpro@sha256:4366…（按 digest 拉会逐字节校验，镜像站换不了内容），
  #   BOT_WXPAD_IMAGE 就写这个带镜像站前缀的 digest 引用（compose 按它在本地找到镜像，不会再去拉）。
  wxpad:
    image: ${BOT_WXPAD_IMAGE:-wechatpadpro/wechatpadpro:latest}
    container_name: beiguo-wxpad
    profiles: ["bot"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    oom_score_adj: 1000
    expose:
      - "8080"
    # 变量名以镜像里的程序为准（2026-10-05 PoC：二进制字符串扫描 + 首次启动日志核对，程序自报 v860.202507011.00 / 861）：
    #   它读 PORT（**缺省 1238**，镜像虽然 EXPOSE 8080 却不听 8080，所以这里必须显式给 8080）、HOST（缺省 0.0.0.0）、
    #   ADMIN_KEY、MYSQL_CONNECT_STR、REDIS_HOST / REDIS_PORT / REDIS_DB / **REDIS_PASS**（不是 REDIS_PASSWORD）、
    #   WORKER_POOL_SIZE、MAX_WORKER_TASK_LEN、*_MQ_ENABLED、KAFKA_ENABLED，以及 gin 自己的 GIN_MODE；
    #   **不读** WECHAT_PORT 与 DB_HOST / DB_PORT（官方 compose 里 WECHAT_PORT 只用于宿主机端口映射）。
    #   另外它自己还起 MCP 服务（SSE 8098、MCP_PORT 缺省 8099，都要带授权码才能用）：不映射端口，只在 Docker 内网。
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      - GIN_MODE=release
      - ADMIN_KEY=${BOT_WXPAD_ADMIN_KEY}
      - REDIS_HOST=wxpad-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASS=${BOT_WXPAD_REDIS_PASSWORD}
      - MYSQL_CONNECT_STR=wxpad:${BOT_WXPAD_DB_PASSWORD}@tcp(db:3306)/wxpad?charset=utf8mb4&parseTime=true&loc=Local
      # 默认 500 个工作协程是给群控用的，这里只有一个小号
      - WORKER_POOL_SIZE=16
      - MAX_WORKER_TASK_LEN=100
      - ROCKET_MQ_ENABLED=false
      - RABBIT_MQ_ENABLED=false
      - KAFKA_ENABLED=false
    depends_on:
      - wxpad-redis
    networks:
      - app-network

  wxpad-redis:
    image: redis:7-alpine
    container_name: beiguo-wxpad-redis
    profiles: ["bot"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 48m
    oom_score_adj: 1000
    # RDB 快照：重启后小号会话还在，不用重新扫码（PoC 第 7 项核实）
    command: redis-server --maxmemory 32mb --maxmemory-policy noeviction --save 300 1 --appendonly no --requirepass ${BOT_WXPAD_REDIS_PASSWORD}
    volumes:
      - wxpad_redis:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
  forum_uploads:
  private_files:
  wxpad_redis:
